<script>'use strict';
const Loto = (() => {
const clone = x => JSON.parse(JSON.stringify(x));
const uid = () => 'id-' + Math.random().toString(36).slice(2,11);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const types = {single:'Один ответ',multiple:'Несколько ответов',text:'Ввод ответа',order:'По порядку'};
function question(n=1){return {id:uid(),type:'single',text:`Сколько будет ${n} + ${n}?`,label:`${n} + ${n}`,stamp:String(n*2),explanation:`${n} + ${n} = ${n*2}`,options:[{id:uid(),text:String(n*2),correct:true},{id:uid(),text:String(n*2+1),correct:false},{id:uid(),text:String(n*2-1),correct:false}],answers:[String(n*2)],caseSensitive:false,yo:true,spaces:true};}
function demo(){const questions=Array.from({length:15},(_,i)=>question(i+1));
Object.assign(questions[3],{type:'multiple',text:'Выберите все чётные числа.',label:'Чётные числа',stamp:'2, 4',explanation:'Чётные числа делятся на 2 без остатка.',options:[{id:uid(),text:'2',correct:true},{id:uid(),text:'3',correct:false},{id:uid(),text:'4',correct:true}]});
Object.assign(questions[7],{type:'text',text:'Как называется результат сложения?',label:'Результат сложения',stamp:'Сумма',answers:['сумма'],explanation:'Результат сложения — сумма.'});
Object.assign(questions[11],{type:'order',text:'Расположите числа от меньшего к большему.',label:'По возрастанию',stamp:'1 → 5',options:['1','3','5'].map(text=>({id:uid(),text,correct:false})),explanation:'1 меньше 3, а 3 меньше 5.'});
questions[14].text='В школьной библиотеке на первой полке стояло 15 книг о природе, а на второй — ещё 15 книг о путешествиях. Сколько всего книг стояло на этих двух полках? Выберите бочонок с правильным ответом.';
const masks=[[0,2,4,6,8],[1,2,3,5,7],[0,3,4,6,8]];
return {version:1,title:'Математическое лото',description:'Решай задания, выбирай бочонки и собери свой счастливый билет!',questions,tickets:Array.from({length:3},(_,t)=>({id:uid(),name:`Билет ${t+1}`,rows:3,cols:9,template:'classic',cells:Array.from({length:27},(_,i)=>masks[Math.floor(i/9)].includes(i%9)?questions[(Math.floor(i/9)*5+masks[Math.floor(i/9)].indexOf(i%9)+t*3)%15].id:null)})),rules:{lives:3,min:1,max:3,emoji:'❤️',lifeFormat:'repeat',faded:true},design:{table:'#155849',accent:'#dcb571',font:'Georgia',background:'',fit:'cover',dim:15,position:'center',ticket:'#fff8e8',ink:'#3a3024',cell:'#fffaf0',barrel:'#edcb8c',radius:12,fontSize:18,selected:'#dcae59',correct:'#56ad81',wrong:'#ed7177',button:'#e4bd77',buttonText:'#322416',checkLabel:'Проверить',modal:'#fffaf0'},hero:{image:'',show:true,x:85,y:75,size:90,opacity:100,flip:false,effect:'glow',color:'#ffd782',duration:1,intensity:15,hover:true,correct:true,wrong:false,win:true},screens:{winTitle:'Блестящая победа!',winText:'Все бочонки на своих местах. Отличная работа!',loseTitle:'Попробуем ещё раз?',loseText:'Каждая попытка делает тебя сильнее.',startButton:'Начать игру',again:'Играть снова'}};}
function normalize(s,q){s=String(s).trim();if(!q.caseSensitive)s=s.toLocaleLowerCase();if(q.yo)s=s.replace(/ё/g,'е').replace(/Ё/g,'Е');if(q.spaces)s=s.replace(/\s+/g,' ');return s;}
function correct(q,a){if(q.type==='text')return q.answers.some(s=>normalize(s,q)===normalize(a,q));if(q.type==='single')return q.options.some(o=>o.id===a&&o.correct);if(q.type==='multiple')return JSON.stringify([...a].sort())===JSON.stringify(q.options.filter(o=>o.correct).map(o=>o.id).sort());return JSON.stringify(a)===JSON.stringify(q.options.map(o=>o.id));}
function validate(p){const errors=[];if(!p||p.version!==1)return ['Неподдерживаемая версия проекта. Нужна версия 1.'];

if(p.questions.length>1000||p.tickets.length>100)return ['Слишком большой проект.'];
for(const key of ['winTitle','winText','loseTitle','loseText','startButton','again'])if(typeof p.screens[key]!=='string')errors.push('Повреждены тексты экранов.');
const limits={radius:[0,24],fontSize:[10,30],dim:[0,80]};for(const [key,[min,max]] of Object.entries(limits))if(!Number.isFinite(p.design[key])||p.design[key]<min||p.design[key]>max)errors.push('Неверное значение оформления: '+key);

const ids=new Set();p.questions.forEach((q,i)=>{const name=`Задание ${i+1}`;if(!q||typeof q.id!=='string'||ids.has(q.id)){errors.push(name+': повторный или отсутствующий ID.');return;}ids.add(q.id);if(!Array.isArray(q.options)||!Array.isArray(q.answers)){errors.push(name+': повреждены варианты ответа.');return;}if(!types[q.type]||typeof q.text!=='string'||!q.text.trim()||typeof q.label!=='string'||!q.label.trim()||typeof q.stamp!=='string')errors.push(name+': заполните текст и подпись.');if(q.type==='text'){if(!Array.isArray(q.answers)||!q.answers.length||q.answers.some(a=>typeof a!=='string'||!a.trim()))errors.push(name+': введите эталон ответа.');}else{if(!Array.isArray(q.options)||q.options.length<2||q.options.length>8||q.options.some(o=>!o||typeof o.text!=='string'||!o.text.trim()||typeof o.id!=='string')||new Set(q.options.map(o=>o.id)).size!==q.options.length)errors.push(name+': нужны 2–8 заполненных вариантов с уникальными ID.');else if(q.type==='single'&&q.options.filter(o=>o.correct).length!==1||q.type==='multiple'&&!q.options.some(o=>o.correct))errors.push(name+': укажите правильные ответы.');}});
const tids=new Set();p.tickets.forEach((t,i)=>{if(!t||typeof t.id!=='string'||tids.has(t.id)){errors.push('Повторный ID билета.');return;}tids.add(t.id);if(typeof t.name!=='string'||!['classic','learning'].includes(t.template))errors.push('Повреждены настройки билета.');if(!Number.isInteger(t.rows)||t.rows<2||t.rows>5||!Number.isInteger(t.cols)||t.cols<2||t.cols>9||!Array.isArray(t.cells)||t.cells.length!==t.rows*t.cols){errors.push(`Билет ${i+1}: неверная сетка.`);return;}if(!t.cells.some(Boolean))errors.push(`Билет ${i+1}: нет заданий.`);if(t.cells.some(id=>id!==null&&!ids.has(id)))errors.push(`Билет ${i+1}: потеряна связь с заданием.`);if(t.template==='classic'&&(t.rows!==3||t.cols!==9||[0,1,2].some(r=>t.cells.slice(r*9,r*9+9).filter(Boolean).length!==5)))errors.push(`Билет ${i+1}: в классическом билете нужно по 5 заданий в строке.`);});
if(!Number.isInteger(p.rules.lives)||p.rules.lives<1||p.rules.lives>10||!Number.isInteger(p.rules.min)||!Number.isInteger(p.rules.max)||p.rules.min<1||p.rules.max>6||p.rules.min>p.rules.max||p.rules.max>p.tickets.length)errors.push('Проверьте число жизней и диапазон билетов.');
for(const src of [p.design.background,p.hero.image])if(src&&(typeof src!=='string'||!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(src)||src.length>14*1024*1024))errors.push('Некорректный или слишком большой ресурс.');
for(const k of ['table','accent','ticket','ink','cell','barrel','selected','correct','wrong','button','buttonText','modal'])if(!/^#[0-9a-f]{6}$/i.test(p.design[k]))errors.push('Некорректный цвет: '+k);
if(!['Arial','Verdana','Georgia','Trebuchet MS'].includes(p.design.font))errors.push('Неподдерживаемый шрифт.');return errors;}
class Session{constructor(p,count){this.p=p;this.tickets=shuffle(p.tickets).slice(0,count);this.lives=p.rules.lives;this.errors=0;this.done=new Set();this.drafts={};this.rejected={};this.orders={};this.total=this.tickets.reduce((s,t)=>s+t.cells.filter(Boolean).length,0);this.status='playing';}
check(key,q,answer){if(this.status!=='playing'||this.done.has(key))return 'blocked';if(answer==null||typeof answer==='string'&&!answer.trim()||Array.isArray(answer)&&!answer.length)return 'empty';const signature=JSON.stringify(answer);if(this.rejected[key]===signature)return 'blocked';if(correct(q,answer)){this.done.add(key);if(this.done.size===this.total)this.status='win';return 'correct';}this.rejected[key]=signature;this.errors++;this.lives--;if(!this.lives)this.status='lose';return 'wrong';}}
return {clone,uid,esc,shuffle,types,question,demo,normalize,correct,validate,Session};
})();
</script><script>class LotoGame {

render(){this.onScreen(this.active?'question':this.screen);const {esc}=Loto,p=this.p,s=this.session;this.root.innerHTML='<div class="game-background"></div><div class="table-stitch"></div><img class="hero" alt="Герой игры"><div class="game-content"></div>';const c=this.root.querySelector('.game-content');
if(this.screen==='start'){c.innerHTML=`<div class="start-screen"><span class="game-eyebrow">УЧИСЬ · ИГРАЙ · ПОБЕЖДАЙ</span><div class="barrel-illustration" aria-hidden="true"><i class="wood small">7</i><i class="wood large">42</i><i class="wood small">15</i></div><span class="game-kicker">УЧЕБНОЕ ЛОТО</span><h1 data-title>${esc(p.title)}</h1><p data-description>${esc(p.description)}</p><div class="start-divider"></div><label for="ticket-count">Сколько билетов возьмём?</label><div class="count-choices" role="group" aria-label="Количество билетов">${Array.from({length:Math.max(0,Math.min(p.rules.max,p.tickets.length)-p.rules.min+1)},(_,i)=>i+p.rules.min).map((n,i)=>`<button class="count-choice ${i===0?'chosen':''}" data-count="${n}" aria-pressed="${i===0}">${n}<small>${n===1?'билет':n<5?'билета':'билетов'}</small></button>`).join('')}</div><button class="gold-button start-play">${esc(p.screens.startButton)} <span>→</span></button><div class="game-instruction"><span>♡ ${p.rules.lives} жизни</span><span>✦ В своём темпе</span></div><p class="game-message" role="status"></p></div>`;let count=p.rules.min;c.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=Number(b.dataset.count);c.querySelectorAll('[data-count]').forEach(e=>{e.classList.toggle('chosen',e===b);e.setAttribute('aria-pressed',e===b);});});c.querySelector('.start-play').onclick=()=>this.start(count);
}else if(this.screen==='win'||this.screen==='lose'){const win=this.screen==='win';c.innerHTML=`<div class="end-screen"><span class="end-icon">${win?'🏆':'🌱'}</span><div class="game-kicker">${win?'ЛОТО СОБРАНО':'НОВАЯ ПОПЫТКА — НОВЫЙ ШАНС'}</div><h1>${esc(p.screens[win?'winTitle':'loseTitle'])}</h1><p>${esc(p.screens[win?'winText':'loseText'])}</p><div class="end-stats"><div><strong>${s?.done.size||0} / ${s?.total||0}</strong><span>Собрано бочонков</span></div><div><strong>${s?.errors||0}</strong><span>Ошибок</span></div></div><button class="gold-button again">${esc(p.screens.again)}</button><button class="text-button home">На главный экран</button></div>`;c.querySelector('.again').onclick=()=>this.restart();c.querySelector('.home').onclick=()=>this.restart(true);
}else{c.innerHTML=`<header class="game-header"><div><span class="game-kicker">УЧЕБНОЕ ЛОТО</span><h2 data-title>${esc(p.title)}</h2></div><div class="game-lives" aria-label="Жизни">${this.livesHTML()}</div></header><div class="game-progress"><span>Собрано бочонков <b>${s.done.size} / ${s.total}</b></span><button class="text-button home">↶ Начать заново</button></div><div class="progress-track"><i style="width:${s.done.size/s.total*100}%"></i></div><div class="answer-zone"></div><div class="tickets">${s.tickets.map(t=>`<section class="loto-ticket"><div class="ticket-heading"><span>✦ ${esc(t.name)}</span><span>${t.cells.filter((q,i)=>q&&s.done.has(t.id+':'+i)).length} / ${t.cells.filter(Boolean).length}</span></div><div class="ticket-grid" style="--cols:${t.cols}">${t.cells.map((id,i)=>{const q=p.questions.find(q=>q.id===id),key=t.id+':'+i,done=s.done.has(key);return q?`<button class="ticket-cell ${done?'closed':''} ${this.active?.key===key?'active':''}" data-cell="${esc(key)}" data-q="${esc(id)}" ${done?'disabled':''} title="${esc(q.text)}">${done?`<span class="mini-barrel">${esc(q.stamp)}</span>`:`<span data-q-label="${esc(id)}">${esc(q.label)}</span>`}</button>`:'<div class="ticket-cell empty" aria-hidden="true"><i>✦</i></div>';}).join('')}</div></section>`).join('')}</div><p class="game-message" role="status" aria-live="polite">Выберите задание на любом билете</p>`;c.querySelector('.home').onclick=()=>this.restart();c.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{if(this.edit){this.onSelect('Задания',b.dataset.q,b.dataset.cell);return;}if(s.status!=='playing')return;this.active={key:b.dataset.cell,id:b.dataset.q};this.render();});this.renderAnswer();}

function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem('loto-studio-v1',JSON.stringify(project));status('Черновик сохранён в браузере');}catch{status('Ошибка автосохранения');toast('Не удалось сохранить черновик. Скачайте проект в файл.');}},650);}
function updateMeta(){$('#project-title').textContent=project.title;const tag=document.createElement('span');tag.textContent='Проект';$('#project-title').append(tag);$('#project-stats').textContent=`${project.tickets.length} билета · ${project.questions.length} заданий`;$('#undo').disabled=!history.length;$('#redo').disabled=!future.length;}
function travel(redo){const from=redo?future:history,to=redo?history:future;if(!from.length)return;to.push(Loto.clone(project));project=from.pop();lastEdit='';dirty=true;game.setProject(project,true);renderSettings();updateMeta();scheduleSave();}

':''} aria-label="Выше">↑</button>`:''}<button data-remove-option="${i}" aria-label="Удалить вариант">×</button></div>`).join('')}</div><button class="small-button wide" id="add-option" ${q.options.length>=8?'disabled':''}>+ Вариант ответа</button><p class="note">${q.type==='order'?'Задайте правильный порядок. В игре элементы будут перемешаны.':'Отметьте правильные ответы слева. В игре варианты будут перемешаны.'}</p>${new Set(q.options.map(o=>o.text.trim())).size!==q.options.length?'<p class="note warning">Есть одинаковые видимые варианты.</p>':''}`);html+=group('Обратная связь',area('Пояснение после верного ответа',`questions.${qi}.explanation`)+`<div class="row"><button class="small-button" id="copy-question">Копировать</button><button class="small-button danger" id="delete-question">Удалить</button></div>`);}}

function uploadUI(target){const src=target==='hero'?project.hero.image:project.design.background;return `${src?`<img class="image-thumbnail" src="${E(src)}" alt="Загруженное изображение">`:''}<button class="upload" data-upload="${target}"><strong>↥</strong>${src?'Заменить изображение':'Загрузить изображение'}<small>PNG, JPG, WebP · до 10 МБ</small></button>${src?`<button class="small-button wide" data-remove-image="${target}">Удалить изображение</button>`:''}`;}
function bindSettings(){const c=$('#settings-content');c.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('input',()=>{let v=el.type==='checkbox'?el.checked:['number','range'].includes(el.type)?Number(el.value):el.value;if(['number','range'].includes(el.type)){if(!el.value||!Number.isFinite(v))return;v=Math.max(Number(el.min||-Infinity),Math.min(Number(el.max||Infinity),v));}const path=el.dataset.path;change(()=>set(path,v),path,/^(rules|tickets|questions)\./.test(path));const r=c.querySelector(`[data-range="${path}"]`);if(r)r.textContent=v;const hex=c.querySelector(`[data-color="${path}"]`);if(hex)hex.textContent=v;if(path.startsWith('screens.')||path==='rules.emoji')game.render();}));
c.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{change(()=>project.design.table=b.dataset.theme);renderSettings();});c.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>{imageTarget=b.dataset.upload;$('#image-file').click();});c.querySelectorAll('[data-remove-image]').forEach(b=>b.onclick=()=>{change(()=>{if(b.dataset.removeImage==='hero')project.hero.image='';else project.design.background='';});renderSettings();});

on('copy-ticket',()=>{if(project.tickets.length>=6)return toast('Достигнут максимум: 6 билетов.');change(()=>{const n=Loto.clone(t);n.id=Loto.uid();n.name+=' — копия';project.tickets.push(n);selectedTicket=n.id;},'',true);renderSettings();});
on('delete-ticket',()=>{if(project.tickets.length===1)return toast('Оставьте хотя бы один билет.');if(!confirm('Удалить билет? Задания останутся в банке.'))return;change(()=>{project.tickets=project.tickets.filter(x=>x.id!==t.id);project.rules.max=Math.min(project.rules.max,project.tickets.length);project.rules.min=Math.min(project.rules.min,project.rules.max);},'',true);renderSettings();});
c.querySelectorAll('[data-mini-cell]').forEach(b=>b.onclick=()=>{selectedCell=Number(b.dataset.miniCell);renderSettings();});on('cell-question',e=>{change(()=>t.cells[selectedCell]=e.target.value||null,'',true);renderSettings();},'change');
const resize=(rows,cols,template)=>{change(()=>{const old=t.cells;t.rows=rows;t.cols=cols;t.template=template;t.cells=Array.from({length:rows*cols},(_,i)=>old[i]||null);if(template==='classic')t.cells=Array.from({length:27},(_,i)=>[0,2,4,6,8].includes(i%9)?old[i]||project.questions[i%project.questions.length]?.id||null:null);},'',true);toast('Сетка обновлена. Все задания сохранены в банке.');renderSettings();};on('ticket-template',e=>resize(e.target.value==='classic'?3:t.rows,e.target.value==='classic'?9:t.cols,e.target.value),'change');on('ticket-rows',e=>resize(Math.max(2,Math.min(5,Number(e.target.value)||2)),t.cols,'learning'),'change');on('ticket-cols',e=>resize(t.rows,Math.max(2,Math.min(9,Number(e.target.value)||2)),'learning'),'change');
c.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{selectedQ=b.dataset.question;renderSettings();});on('question-search',e=>c.querySelectorAll('[data-question]').forEach(b=>b.hidden=!b.dataset.search.includes(e.target.value.toLowerCase())),'input');const q=project.questions.find(q=>q.id===selectedQ);
on('add-question',()=>{change(()=>{const n=Loto.question(project.questions.length+1);project.questions.push(n);selectedQ=n.id;},'',true);renderSettings();});on('copy-question',()=>{change(()=>{const n=Loto.clone(q);n.id=Loto.uid();n.label+=' — копия';n.options.forEach(o=>o.id=Loto.uid());project.questions.push(n);selectedQ=n.id;},'',true);renderSettings();});
on('delete-question',()=>{if(!confirm('Удалить задание? Связанные клетки станут пустыми.'))return;change(()=>{project.questions=project.questions.filter(x=>x.id!==q.id);project.tickets.forEach(t=>t.cells=t.cells.map(id=>id===q.id?null:id));},'',true);renderSettings();});
on('question-type',e=>{change(()=>{q.type=e.target.value;if(q.type==='single')q.options.forEach((o,i)=>o.correct=i===0);if(q.type==='multiple'&&!q.options.some(o=>o.correct))q.options[0].correct=true;},'',true);renderSettings();},'change');
on('text-answers',e=>change(()=>q.answers=e.target.value.split('\n'),'answers-'+q.id,true),'input');c.querySelectorAll('[data-option]').forEach(el=>el.oninput=()=>change(()=>q.options[Number(el.dataset.option)].text=el.value,'option-'+q.id+el.dataset.option,true));c.querySelectorAll('[data-correct]').forEach(el=>el.onchange=()=>{change(()=>{if(q.type==='single')q.options.forEach(o=>o.correct=false);q.options[Number(el.dataset.correct)].correct=el.checked;},'',true);renderSettings();});on('add-option',()=>{change(()=>q.options.push({id:Loto.uid(),text:'Новый вариант',correct:false}),'',true);renderSettings();});c.querySelectorAll('[data-remove-option]').forEach(b=>b.onclick=()=>{if(q.options.length<=2)return toast('Нужно минимум два варианта.');change(()=>q.options.splice(Number(b.dataset.removeOption),1),'',true);renderSettings();});c.querySelectorAll('[data-option-up]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.optionUp);change(()=>[q.options[i-1],q.options[i]]=[q.options[i],q.options[i-1]],'',true);renderSettings();});on('validate',()=>validationDialog());}
function validationDialog(){const errors=Loto.validate(project);modal(errors.length?'Нужно исправить':'Проект готов к игре',errors.length?'<ul>'+errors.map(s=>'<li>'+E(s)+'</li>').join('')+'</ul><p>Исправьте поля в разделах «Задания», «Билеты» или «Правила».</p>':'<p>Задания, ответы, связи клеток и диапазон билетов проверены. Можно скачивать игру.</p>');return !errors.length;}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);}
$('#save').onclick=()=>{download('Мой проект.loto.json',JSON.stringify(project,null,2),'application/json');dirty=false;status('Проект выгружен в файл');toast('Проект сохранён. Его можно открыть на другом компьютере.');};$('#load').onclick=()=>$('#project-file').click();
$('#project-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>35*1024*1024)return toast('Размер проекта превышает 35 МБ.');try{const p=JSON.parse(await file.text()),errors=Loto.validate(p);if(errors.length)throw new Error(errors.slice(0,5).join('\n'));if(dirty&&!confirm('Заменить текущий проект? Несохранённые изменения будут доступны через «Обратно».'))return;await Promise.all([p.design.background,p.hero.image].filter(Boolean).map(decodeImage));change(()=>project=p,'',true);renderSettings();toast('Проект загружен.');}catch(err){modal('Не удалось открыть проект','<p>'+E(err.message)+'</p><p>Текущий проект сохранён без изменений.</p>');}};
function decodeImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Изображение повреждено.'));img.src=src;});}
$('#image-file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>10*1024*1024)return toast('Изображение должно быть не больше 10 МБ.');try{const bytes=new Uint8Array(await f.slice(0,16).arrayBuffer());let mime;if(bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71)mime='image/png';else if(bytes[0]===255&&bytes[1]===216&&bytes[2]===255)mime='image/jpeg';else if(String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')mime='image/webp';else throw new Error('Выберите настоящее изображение PNG, JPEG или WebP.');toast('Загружаю изображение…');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.replace(/^data:[^;]+;/,'data:'+mime+';'));r.onerror=()=>reject(new Error('Не удалось прочитать файл.'));r.readAsDataURL(f);});const img=await decodeImage(data);if(img.width*img.height>40000000)throw new Error('Изображение слишком большое: максимум 40 мегапикселей.');change(()=>{if(imageTarget==='hero')project.hero.image=data;else project.design.background=data;});renderSettings();toast(JSON.stringify(project).length>27*1024*1024?'Ресурсы превышают 20 МБ. Используйте «Облегчить код».':'Изображение загружено.');}catch(err){toast(err.message);}};
$('#export').onclick=()=>{if(Loto.validate(project).length)return validationDialog();download('Лото.html',makeHTML(project),'text/html');toast('Автономная игра скачана. Откройте HTML в браузере.');};
$('#embed').onclick=()=>{modal('Код для Genially','<p>Скачайте HTML, разместите его на HTTPS-хостинге, который разрешает iframe, и вставьте адрес ниже. Затем добавьте код через встраивание внешнего контента в Genially.</p><label class="field"><span>HTTPS-адрес опубликованной игры</span><input id="publish-url" type="url" placeholder="https://example.com/loto.html"></label><div class="row"><label class="field"><span>Ширина, px</span><input id="embed-width" type="number" value="960" min="360" max="2400"></label><label class="field"><span>Высота, px</span><input id="embed-height" type="number" value="720" min="360" max="2400"></label></div><label class="checkbox"><input id="embed-responsive" type="checkbox" checked>Адаптивная ширина</label><label class="field"><span>Код встраивания</span><textarea id="embed-code" readonly rows="5"></textarea></label><p id="embed-error">Введите адрес игры. Локальные файлы и временные ссылки не подходят.</p><button class="small-button wide" id="copy-embed" disabled>Копировать код</button><p>Совместимость зависит от хостинга и возможностей вашего аккаунта Genially. Проверьте игру после публикации.</p>');const generate=()=>{try{const u=new URL($('#publish-url').value);if(u.protocol!=='https:'||u.username||u.password||['localhost','127.0.0.1'].includes(u.hostname))throw Error();const h=Math.max(360,Math.min(2400,Number($('#embed-height').value)||720)),w=$('#embed-responsive').checked?'100%':Math.max(360,Math.min(2400,Number($('#embed-width').value)||960));$('#embed-code').value=`<iframe src="${E(u.href)}" title="Учебное лото" width="${w}" height="${h}" style="border:0;border-radius:16px" allowfullscreen></iframe>`;$('#copy-embed').disabled=false;$('#embed-error').textContent='Код готов. Вставьте его в опубликованный материал Genially.';}catch{$('#embed-code').value='';$('#copy-embed').disabled=true;$('#embed-error').textContent='Нужен полный HTTPS-адрес опубликованной игры.';}};['publish-url','embed-width','embed-height','embed-responsive'].forEach(id=>$('#'+id).oninput=generate);$('#copy-embed').onclick=async()=>{try{await navigator.clipboard.writeText($('#embed-code').value);toast('Код скопирован.');}catch{$('#embed-code').select();toast('Код выделен. Нажмите Ctrl/Cmd+C.');}};};
$('#optimize').onclick=()=>{if(Loto.validate(project).length)return validationDialog();modal('Облегчить код','<p>Создадим отдельную копию для экспорта. Оригинальные изображения и проект сохранятся.</p><label class="field"><span>Максимальная сторона изображения</span><select id="opt-size"><option value="1920">1920 px · высокое качество</option><option value="1280" selected>1280 px · баланс размера и качества</option><option value="960">960 px · компактный файл</option></select></label><label class="field"><span>Качество WebP</span><input id="opt-quality" type="range" min="50" max="100" value="85"></label><button id="run-opt" class="small-button wide">Подготовить облегчённый HTML</button><div id="opt-result"></div>');$('#run-opt').onclick=async()=>{const b=$('#run-opt');b.disabled=true;b.textContent='Оптимизация…';try{const copy=Loto.clone(project),max=Number($('#opt-size').value),quality=Number($('#opt-quality').value)/100;for(const [obj,key] of [[copy.design,'background'],[copy.hero,'image']]){if(!obj[key])continue;const img=await decodeImage(obj[key]),ratio=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));if(blob){const data=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(blob);});if(data.length<obj[key].length)obj[key]=data;}}const used=new Set(copy.tickets.flatMap(t=>t.cells).filter(Boolean));copy.questions=copy.questions.filter(q=>used.has(q.id));const before=new Blob([makeHTML(project)]).size,html=makeHTML(copy),after=new Blob([html]).size;$('#opt-result').innerHTML=`<div class="optimization-stats"><div><span>Обычный файл</span><strong>${(before/1024).toFixed(1)} КБ</strong></div><div><span>После оптимизации</span><strong>${(after/1024).toFixed(1)} КБ</strong></div></div><p>${after<before?'Уменьшение на '+((1-after/before)*100).toFixed(1)+'%.':'Файл уже компактный: дополнительного уменьшения нет.'}</p>${project.design.background?`<div class="row"><div><p>Оригинал</p><img class="image-thumbnail" src="${E(project.design.background)}" alt="Исходный фон"></div><div><p>Результат</p><img class="image-thumbnail" src="${E(copy.design.background)}" alt="Сжатый фон"></div></div>`:''}<button id="download-opt" class="small-button wide">Скачать облегчённую игру</button>`;$('#download-opt').onclick=()=>download('Лото — облегчённая.html',html,'text/html');}catch(err){toast('Не удалось оптимизировать: '+err.message);}finally{b.disabled=false;b.textContent='Подготовить заново';}};};
$('#help').onclick=()=>modal('От идеи до готовой игры','<ol><li><b>Дизайн.</b> Назовите игру, выберите тему и загрузите фон.</li><li><b>Задания.</b> Создайте вопросы, отметьте правильные ответы. Доступны четыре типа.</li><li><b>Билеты.</b> Выберите клетку и назначьте задание. В классическом билете должно быть по пять заданий в каждой строке.</li><li><b>Правила.</b> Укажите жизни и количество билетов.</li><li><b>Тест.</b> Пройдите игру как ученик.</li><li><b>Сохранить проект.</b> Скачайте редактируемый .loto.json.</li><li><b>Скачать HTML.</b> Передайте файл ученикам: игра работает без интернета.</li></ol><p>Кнопки «Обратно» и «Вперёд» хранят до 120 действий. Черновик сохраняется в этом браузере. Для надёжного хранения скачивайте проект.</p><p>Игровое оформление вдохновлено <a href="https://play.google.com/pc-store/games/details?hl=ru&amp;id=com.rstgames.loto" target="_blank" rel="noopener">компьютерной версией «Лото Онлайн»</a>. Графика стола и бочонков создана средствами CSS.</p>');
function mode(edit){game.edit=edit;$('#game').classList.toggle('editing',edit);$('#edit-mode').classList.toggle('active',edit);$('#test-mode').classList.toggle('active',!edit);toast(edit?'Нажмите на клетку билета, чтобы редактировать её задание.':'Тест: играйте как ученик. Ответы не изменяют проект.');}$('#edit-mode').onclick=()=>mode(true);$('#test-mode').onclick=()=>mode(false);$('#restart').onclick=()=>game.restart(true);$('#device').onchange=e=>$('.preview-frame').className='preview-frame '+e.target.value;document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-screen]').forEach(x=>x.classList.toggle('active',x===b));game.show(b.dataset.screen);});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
renderSettings();updateMeta();$('#game').classList.add('editing');try{const raw=localStorage.getItem('loto-studio-v1');if(raw){modal('Продолжить работу?','<p>В этом браузере найден сохранённый черновик. Восстановить его или открыть демонстрационную игру?</p><div class="dialog-actions"><button id="discard-draft">Открыть пример</button><button class="primary" id="restore-draft">Восстановить</button></div>');$('#discard-draft').onclick=()=>$('#dialog').close();$('#restore-draft').onclick=()=>{try{const p=JSON.parse(raw),errors=Loto.validate(p);if(errors.length)throw new Error(errors[0]);project=p;game.setProject(project,true);renderSettings();updateMeta();status('Черновик восстановлен');$('#dialog').close();}catch(err){toast('Не удалось восстановить: '+err.message);}};}}catch{status('Автосохранение недоступно');}
</script></body></html>
